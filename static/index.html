<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beets Monitor</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="favicon.png">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3.2" class="brand-hole"/></svg>
                <div>
                    <h1>Beets Monitor</h1>
                    <div class="brand-sub">Music catalog</div>
                </div>
            </div>
            <nav class="tabs" role="tablist">
                <button class="tab-btn active" data-tab="catalog" onclick="switchTab('catalog')">Catalog</button>
                <button class="tab-btn" data-tab="watched" onclick="switchTab('watched')">Watched</button>
                <button class="tab-btn" data-tab="recent" onclick="switchTab('recent')">Recent</button>
                <button class="tab-btn" data-tab="web" onclick="switchTab('web')">Artist Web</button>
            </nav>
            <div class="header-actions">
                <div class="track-stats" id="trackStats"></div>
                <button class="update-btn" onclick="updateCatalog()">Update Catalog</button>
            </div>
        </div>
    </header>

    <main class="catalog-container">
        <div id="loading" class="loading">Loading catalog...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="toast-container"></div>

        <div id="catalogTab" class="tab-content active">
            <ul id="artistList" class="artist-list"></ul>
        </div>

        <div id="watchedTab" class="tab-content">
            <ul id="watchedList" class="watched-list"></ul>
        </div>

        <div id="recentTab" class="tab-content">
            <div class="recent-toolbar">
                <div class="recent-range">
                    <button data-range="90" class="active" onclick="setRecentRange('90')">Last 90 days</button>
                    <button data-range="all" onclick="setRecentRange('all')">All</button>
                </div>
                <span id="recentCount" class="recent-count"></span>
            </div>
            <ul id="recentList" class="release-list"></ul>
        </div>

        <div id="webTab" class="tab-content">
            <div class="web-toolbar">
                <div class="web-controls">
                    <input id="artistSearch" class="artist-search" list="artistOptions"
                           placeholder="Pick an artist" autocomplete="off" onchange="onArtistSearch()">
                    <datalist id="artistOptions"></datalist>
                    <label class="web-filter">
                        Min shared:
                        <select id="minSharedFilter" onchange="applyGraphFilter()">
                            <option value="1" selected>1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </label>
                    <label class="web-filter">
                        Neighbors:
                        <select id="maxNeighborsFilter" onchange="renderGraph(); renderExplore(); renderPlaylist()">
                            <option value="8">8</option>
                            <option value="12" selected>12</option>
                            <option value="16">16</option>
                            <option value="24">24</option>
                        </select>
                    </label>
                    <button class="update-btn modal-secondary" onclick="refreshArtistGenres()">Fetch genres</button>
                </div>
                <div class="web-legend">
                    <span class="legend-item">Shared genres: 1
                        <span id="sharedLegendBar" class="legend-bar"></span>
                        <span id="sharedLegendMax">1</span></span>
                    <span class="legend-item"><span class="legend-ring"></span>In playlist</span>
                    <span class="web-stats" id="webStats"></span>
                </div>
            </div>
            <div id="webEmpty" class="web-empty" style="display: none;"></div>
            <div class="web-layout">
                <div class="web-graph-wrap">
                    <svg id="webGraph" class="web-graph"></svg>
                    <div id="webHint" class="web-hint" style="display: none;">
                        Pick a starting artist from the search box.
                    </div>
                    <div class="web-graph-tip">Click to explore · Shift-click to add · Drag to pan</div>
                </div>
                <aside class="web-side">
                    <section id="explorePane" class="side-card explore-pane"></section>
                    <section class="side-card playlist-pane">
                        <div class="pane-head">
                            <h3>Playlist <span class="pane-count" id="playlistCount">0</span></h3>
                            <span class="pane-actions">
                                <button class="modal-link-btn" onclick="openPlexModal()">Load from Plex</button>
                                <button class="modal-link-btn" onclick="clearPlaylist()">Clear</button>
                            </span>
                        </div>
                        <input type="text" id="playlistName" class="modal-input" placeholder="Playlist name"
                               autocomplete="off" oninput="onPlaylistNameInput(this.value)">
                        <ul id="playlistList" class="similar-list playlist-list"></ul>
                        <button id="playlistCreateBtn" class="update-btn" onclick="createPlaylist()" disabled>Create playlist</button>
                    </section>
                </aside>
            </div>
        </div>
    </main>

    <div id="plexModal" class="modal-overlay" style="display: none;" onclick="if(event.target===this)closePlexModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closePlexModal()" title="Close">×</button>
            <div id="plexModalBody"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
