<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beets Monitor - Music Catalog</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="favicon.png">
</head>
<body>
    <div class="catalog-container">
        <div class="header">
            <h1>Beets Monitor - Music Catalog</h1>
            <div class="track-stats" id="trackStats"></div>
            <div class="button-group">
                <button class="update-btn" onclick="updateCatalog()">Update Catalog</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('catalog')">Catalog</button>
            <button class="tab-btn" onclick="switchTab('watched')">Watched Albums</button>
            <button class="tab-btn" onclick="switchTab('web')">Artist Web</button>
        </div>

        <div id="loading" class="loading">Loading catalog...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="toast-container"></div>

        <div id="catalogTab" class="tab-content active">
            <ul id="artistList" class="artist-list"></ul>
        </div>

        <div id="watchedTab" class="tab-content">
            <ul id="watchedList" class="watched-list"></ul>
        </div>

        <div id="webTab" class="tab-content">
            <div class="web-toolbar">
                <div class="web-controls">
                    <label class="web-filter">
                        Artist:
                        <input id="artistSearch" class="artist-search" list="artistOptions"
                               placeholder="Search an artist…" onfocus="this.value=''" onchange="onArtistSearch()">
                        <datalist id="artistOptions"></datalist>
                    </label>
                    <label class="web-filter">
                        Min shared:
                        <select id="minSharedFilter" onchange="applyGraphFilter()">
                            <option value="1">1</option>
                            <option value="2" selected>2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </label>
                    <label class="web-filter">
                        Neighbors:
                        <select id="maxNeighborsFilter" onchange="renderGraph()">
                            <option value="8">8</option>
                            <option value="12" selected>12</option>
                            <option value="16">16</option>
                            <option value="24">24</option>
                        </select>
                    </label>
                    <button class="update-btn" onclick="refreshArtistGenres()">Fetch genres from MusicBrainz</button>
                    <button class="update-btn" onclick="createPlaylist()">Create playlist</button>
                </div>
                <div class="web-legend">
                    <span class="legend-item"><span class="legend-dot status-complete-dot"></span>Complete</span>
                    <span class="legend-item"><span class="legend-dot status-partial-dot"></span>Partial</span>
                    <span class="legend-item"><span class="legend-dot status-missing-dot"></span>Missing</span>
                    <span class="web-stats" id="webStats"></span>
                </div>
            </div>
            <div id="webEmpty" class="web-empty" style="display: none;"></div>
            <div class="web-graph-wrap">
                <svg id="webGraph" class="web-graph"></svg>
                <div id="artistPanel" class="artist-panel" style="display: none;"></div>
            </div>
        </div>
    </div>

    <div id="playlistModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" onclick="closePlaylistModal()" title="Close">×</button>
            <h3>Create playlist</h3>
            <label class="modal-field-label" for="playlistName">Playlist name</label>
            <input type="text" id="playlistName" class="modal-input" autocomplete="off">
            <div class="panel-section-title">
                Artists (<span id="playlistArtistCount">0</span> selected)
                <span class="modal-select-actions">
                    <button type="button" class="modal-link-btn" onclick="togglePlaylistArtists(true)">All</button>
                    <button type="button" class="modal-link-btn" onclick="togglePlaylistArtists(false)">None</button>
                </span>
            </div>
            <ul id="playlistArtistList" class="playlist-artist-list"></ul>
            <div class="modal-actions">
                <button class="update-btn modal-secondary" onclick="closePlaylistModal()">Cancel</button>
                <button id="playlistCreateBtn" class="update-btn" onclick="confirmCreatePlaylist()">Create playlist</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
