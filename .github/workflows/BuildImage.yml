name: Docker Build and Push to GHCR

on:
  push:
    branches:
      - main
  # Renovate's branches only get a build check via the PR, and an image that
  # does not build should never reach main.
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # When the job itself runs in a container (e.g. a Gitea act_runner), the
      # buildkit container otherwise lands on the default bridge and cannot
      # reach the runner's cache server, so every cache request times out.
      # Put buildkit on the job container's network instead. On GitHub's
      # runners the job is not a container, so this finds nothing.
      - name: Detect job container network
        id: net
        run: |
          network=$(docker inspect "$(hostname)" \
            --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' \
            2>/dev/null | awk '{print $1}' || true)
          echo "Job container network: ${network:-none}"
          echo "driver-opts=${network:+network=$network}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: ${{ steps.net.outputs.driver-opts }}

      # Self-hosted runners have no GHCR credentials, so they build only.
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.server_url == 'https://github.com' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pull requests are build-validation only: nothing is published
          # until the change is on main.
          push: ${{ github.server_url == 'https://github.com' && github.event_name != 'pull_request' }}
          # arm64 needs QEMU binfmt, which only the hosted runners preregister.
          platforms: ${{ github.server_url == 'https://github.com' && 'linux/amd64,linux/arm64/v8' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx runs in a throwaway container, so without this every run
          # re-pulls base images and rebuilds every layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
